<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Harnith Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="index.html" class="logo"><img src="assets/images/logo.png" alt="Harnith Collection" class="logo-img"></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav class="main-nav" id="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop All</a>
      <a href="shop.html?gender=men">Men</a>
      <a href="shop.html?gender=women">Women</a>
      <a href="shop.html?category=thrift">Thrift</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-link">Cart <span class="cart-count" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<section class="section wrap">
  <div class="section-head reveal-left"><div><span class="eyebrow">Your bag</span><h2>Cart</h2></div></div>

  <div id="cart-body" class="reveal-right"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© <span id="year"></span> Harnith Collection</span>
      <span>Site by IbrahimAbdulqadir</span>
    </div>
  </div>
</footer>

<script src="assets/js/store.js"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();

function render() {
  const cart = getCart();
  const body = document.getElementById("cart-body");

  if (cart.length === 0) {
    body.innerHTML = `<div class="empty-state">Your cart is empty. <a href="shop.html" style="color:var(--rust); border-bottom:1px solid var(--rust);">Go find something</a>.</div>`;
    return;
  }

  const rows = cart.map(item => `
    <tr>
      <td>
        <div class="cart-item-info">
          <img src="${item.image}" alt="${item.name}">
          <div>
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-meta">Size ${item.size}</div>
          </div>
        </div>
      </td>
      <td class="cart-item-meta">${formatPrice(item.price)}</td>
      <td>
        <div class="qty-control" style="display:inline-flex;">
          <button type="button" data-action="minus" data-id="${item.id}" data-size="${item.size}">−</button>
          <span>${item.qty}</span>
          <button type="button" data-action="plus" data-id="${item.id}" data-size="${item.size}">+</button>
        </div>
      </td>
      <td class="cart-item-meta">${formatPrice(item.price * item.qty)}</td>
      <td><button class="cart-remove" data-action="remove" data-id="${item.id}" data-size="${item.size}">Remove</button></td>
    </tr>
  `).join("");

  body.innerHTML = `
    <div class="cart-table-scroll">
    <table class="cart-table">
      <thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div class="cart-summary">
      <div class="row"><span>Subtotal</span><span>${formatPrice(cartTotal())}</span></div>
      <div class="row"><span>Shipping</span><span>Calculated at checkout</span></div>
      <div class="row total"><span>Total</span><span>${formatPrice(cartTotal())}</span></div>
      <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top:18px;">Proceed to checkout</a>
    </div>
  `;

  body.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id, size = btn.dataset.size, action = btn.dataset.action;
      if (action === "remove") {
        removeFromCart(id, size);
      } else {
        const cart = getCart();
        const item = cart.find(i => i.id === id && i.size === size);
        if (item) updateCartQty(id, size, action === "plus" ? item.qty + 1 : item.qty - 1);
      }
      render();
    });
  });
}

render();
</script>
</body>
</html>
